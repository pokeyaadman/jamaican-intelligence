name: Synthetic publication preview checks
on:
  pull_request:
    paths:
      - 'tools/publication_preview_v1_1.py'
      - 'tests/test_publication_preview_v1_1.py'
      - '.github/workflows/publication-preview-checks.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_publication_preview_v1_1.py'
